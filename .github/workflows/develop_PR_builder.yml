name: Makers MDS CI

on:
  pull_request:
    branches: [ develop, master ]

jobs:
  build:
    name: PR Checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 최신 안정화 버전 권장

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Library
        run: ./gradlew :mds:assembleDebug --stacktrace

      - name: Build Storybook App
        run: ./gradlew :storybook:assembleDebug --stacktrace